version: "3.8"
services:
  frontend:
    build: ./frontend
    container_name: shopsphere-frontend
    ports:
      - "8080:80"
    networks:
      - shopsphere-net
    depends_on:
      - backend
  backend:
    build: ./backend
    container_name: shopsphere-backend
    ports:
      - "5000:5000"
    networks:
      - shopsphere-net
    environment:
      MONGO_URI: mongodb://database:27017
    depends_on:
      - database

  database:
    image: mongo:8
    container_name: shopsphere-db
    volumes:
      - shopsphere_vol:/data/db
    networks:
      - shopsphere-net
volumes:
  shopsphere_vol:
networks:
  shopsphere-net:
